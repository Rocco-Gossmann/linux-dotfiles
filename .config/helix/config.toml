theme="mytheme"

[editor]
line-number="relative"
rulers = [80, 120]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[keys.normal]
# Vim-Style Undo/Redo (just to not confuse muscle memory to much)
C-r = "redo"
u = "undo"

";" = "repeat_last_motion" # vim-style (move to next, after f,F,t,T)

# these are different keystrokes, having them both on one key saves time 
esc = ["collapse_selection", "keep_primary_selection"]

[keys.normal.E]
# E E => external Explorer
"E"  =  [
  ":new",
  ":insert-output lf-pick",
  "select_all",
  "split_selection_on_newline",
  "goto_file",
  "goto_last_modified_file",
  ":buffer-close!",
  ":redraw"
]

# E G => LazyGit
"G" = [ ":new", ":insert-output lazygit", ":buffer-close!", ":redraw" ]

 # E D => LazyDocker
"D" = [ ":new", ":insert-output lazydocker", ":buffer-close!", ":redraw" ]

# E ZQWA - makes quitting a lot less painfull
S-z = ":quit"           # quit buffer, warn if unsaved
S-q = ":quit!"          # quit buffer, ignore unsaved
S-w = ":write-quit-all" # save all and quit all
S-a = ":quit-all"       # quit all, warn if unsaved

# Split navi via ctrl-hjkl
C-h = ["jump_view_left"]
C-j = ["jump_view_down"]
C-k = ["jump_view_up"]
C-l = ["jump_view_right"]

[keys.select]
# Original Upper / Lower conversions are awefull on german QWERTZ
S-u="switch_to_uppercase"
u="switch_to_lowercase"
