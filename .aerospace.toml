# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# BM: Initial Settings
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
# =============================================================================
after-login-command = []
after-startup-command = []
start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = 'tiles'     # See: https://nikitabobko.github.io/AeroSpace/guide#layouts
default-root-container-orientation = 'auto' # Possible values: horizontal|vertical|auto
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = true

accordion-padding = 30

# BM: Assigned Monitors find monitors via `aerospace list-monitors`
#==============================================================================
[workspace-to-monitor-force-assignment]
	Main1    = ['main']
	Main2    = ['main']
	Main3    = ['main']
	Term     = ['main']
	Coms     = ['main']
	Browsers = ['main']

	Side1    = [ 'Yam Display', 'secondary' ]
	Side2    = [ 'Yam Display', 'secondary' ]
	Side3    = [ 'Yam Display', 'secondary' ]
	Plans    = [ 'Yam Display', 'secondary' ]

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}

# BM: Normal Mode mode
#===============================================================================

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

[mode.main.binding]

    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                   sectionSign (ISO keyboards only, european keyboards only)
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # You can uncomment the following lines to open up terminal with alt + enter shortcut
    # (like in i3)
    # alt-enter = '''exec-and-forget osascript -e '
    # tell application "Terminal"
    #     do script
    #     activate
    # end tell'
    # '''

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-shift-slash              = 'resize smart -50' # slash = minus on qwertz
    alt-shift-rightSquareBracket = 'resize smart +50' # ] = plus on qwertz

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    # alt-1 = 'workspace Main1'
    # alt-2 = 'workspace Main2'
    # alt-3 = 'workspace Main3'
    #
    # alt-4 = 'workspace Side1'
    # alt-5 = 'workspace Side2'
    # alt-6 = 'workspace Side3'

    alt-f = 'layout floating tiling'				# Toggle between floating and tiling layout
	alt-t = 'layout tiles horizontal vertical'
	alt-s = 'layout accordion horizontal vertical'

	alt-ctrl-k = ['workspace prev']
	alt-ctrl-j = ['workspace next' ]
	alt-ctrl-h = ['focus-monitor prev' ]
	alt-ctrl-l = ['focus-monitor next']

    alt-ctrl-shift-h = ['join-with left']
    alt-ctrl-shift-j = ['join-with down']
    alt-ctrl-shift-k = ['join-with up']
    alt-ctrl-shift-l = ['join-with right']


    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    alt-shift-1 = ['move-node-to-workspace Main1', 'workspace Main1']
    alt-shift-2 = ['move-node-to-workspace Main2', 'workspace Main2']
    alt-shift-3 = ['move-node-to-workspace Main3', 'workspace Main3']

    alt-shift-4 = ['move-node-to-workspace Side1', 'workspace Side1']
    alt-shift-5 = ['move-node-to-workspace Side2', 'workspace Side2']
    alt-shift-6 = ['move-node-to-workspace Side3', 'workspace Side3']

    # See: https://nikitabobko.github.io/AeroSpace/command#workspace-back-and-forth
    # alt-tab = 'workspace-back-and-forth'
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    # alt-shift-tab = 'move-workspace-to-monitor --swrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-w = 'mode window'


# BM: Window Edit Mode
#===============================================================================
[mode.window.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout

    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    f = ['layout floating tiling', 'mode main']					# Toggle between floating and tiling layout
	t = ['layout tiles horizontal vertical', 'mode main']       #
	s = ['layout accordion horizontal vertical', 'mode main']
    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    h = 'move left'
    j = 'move down'
    k = 'move up'
    l = 'move right'

	up = ['move-node-to-workspace prev',  'workspace prev']
	down = ['move-node-to-workspace next',  'workspace next']
	left = ['move-node-to-monitor prev',  'focus-monitor prev']
	right = ['move-node-to-monitor next',  'focus-monitor next']


	n = ['move-node-to-workspace next',  'workspace next']
	p = ['move-node-to-workspace prev',  'workspace prev']

	1 = ['move-node-to-workspace Main1', 'workspace Main1', 'mode main']
	2 = ['move-node-to-workspace Main2', 'workspace Main2', 'mode main']
	3 = ['move-node-to-workspace Main3', 'workspace Main3', 'mode main']

	4 = ['move-node-to-workspace Side1', 'workspace Side1', 'mode main']
	5 = ['move-node-to-workspace Side2', 'workspace Side2', 'mode main']
	6 = ['move-node-to-workspace Side3', 'workspace Side3', 'mode main']

# BM: App specific settings
#===============================================================================
# BM: Floating Apps
#-------------------------------------------------------------------------------
# find app-name via `aerospace list-apps --json`
[[on-window-detected]]
    if.app-name-regex-substring = 'java'
    run = [ 'layout floating' ]

[[on-window-detected]]
	if.app-id = 'com.apple.QuickTimePlayerX'
    run = [ 'layout floating' ]

[[on-window-detected]]
	if.app-id = 'com.itaysoft.CameraController'
    run = [ 'layout floating' ]

[[on-window-detected]]
	if.app-name-regex-substring = 'Zen'
	if.window-title-regex-substring = 'Picture-in-Picture'
    run = [ 'layout floating' ]

[[on-window-detected]]
	if.app-name-regex-substring = 'Slack'
	if.window-title-regex-substring = 'Huddle'
	run = [ 'layout floating', 'move-node-to-workspace Coms' ]

# BM: Window workspaces
#-------------------------------------------------------------------------------
[[on-window-detected]]
	if.app-id = 'com.mitchellh.ghostty'
	run = ['move-node-to-workspace Term']

[[on-window-detected]]
	if.app-id = 'com.apple.iCal'
	run = ['move-node-to-workspace Plans']

[[on-window-detected]]
	if.app-id = 'com.apple.mail'
	run = ['move-node-to-workspace Plans']

[[on-window-detected]]
	if.app-id = 'com.tinyspeck.slackmacgap'
	run = ['move-node-to-workspace Coms']

[[on-window-detected]]
	if.app-id = 'com.microsoft.teams2'
	run = ['move-node-to-workspace Coms']

[[on-window-detected]]
	if.app-id = 'app.zen-browser.zen'
	run = ['move-node-to-workspace Browsers']

[[on-window-detected]]
	if.app-id = 'org.chromium.Chromium'
	run = ['move-node-to-workspace Browsers']

[[on-window-detected]]
	if.app-id = 'com.brave.Browser'
	run = ['move-node-to-workspace Browsers']



# Stuff you should never have to touch
#==============================================================================
# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
    inner.horizontal = 0
    inner.vertical =   0
    outer.left =       0
    outer.bottom =     0
    outer.top =        0
    outer.right =      0
